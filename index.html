<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oogie's Army Calculator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

<div class="card title-card">
<h1>⚔️ Oogie's Army Calculator</h1>
<p class="subtitle">Kingshot Rally Planner</p>

<button class="guide-button">
Find guides to your favorite events here!
</button>
</div>

<div class="card">
<h2>Number of Troops</h2>

<div class="grid">

<div>
<label>Infantry</label>
<input type="number" id="infantry">
</div>

<div>
<label>Cavalry</label>
<input type="number" id="cavalry">
</div>

<div>
<label>Archer</label>
<input type="number" id="archer">
</div>

<div>
<div class="label-row">
<label>Deployment Capacity</label>
<button class="help-button">❔</button>
</div>
<input type="number" id="capacity">
</div>

</div>
</div>

<div class="card">
<h2>Modifiers</h2>

<label>Troop Ratio</label>
<select id="ratio">
<option value="10/10/80">10/10/80</option>
<option value="5/10/75">5/10/75</option>
<option value="50/20/30">50/20/30</option>
<option value="custom">Custom Ratio</option>
</select>

<div id="customRatioContainer" class="hidden">
<label>Custom Ratio</label>
<input type="text" id="customRatio" placeholder="10/10/80">
</div>

<label>Choose # of Formations</label>
<select id="formations">
<option>1</option>
<option>2</option>
<option>3</option>
<option selected>4</option>
<option>5</option>
<option>6</option>
<option>7</option>
<option>8</option>
<option>9</option>
<option>10</option>
</select>

</div>

<div class="card">
<h2>Rules</h2>

<div class="toggle-row">
<span>Bear Trap Event</span>
<label class="switch">
<input type="checkbox" id="bearTrap">
<span class="slider"></span>
</label>
</div>

<div id="fillFirstContainer" class="hidden">
<div class="toggle-row">
<span>Fill 1st March</span>
<label class="switch">
<input type="checkbox" id="fillFirst">
<span class="slider"></span>
</label>
</div>
</div>

</div>

<div class="card">
<h2>Marches</h2>
<div id="results"></div>
</div>

</div>

<script src="script.js"></script>
</body>
</html>
