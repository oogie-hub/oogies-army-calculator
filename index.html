<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Oogie's Army Calculator</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div class="app">

    <div class="card title-card">
      <h1>⚔ Oogie's Army Calculator</h1>
      <p>Kingshot Rally Planner</p>
    </div>

    <div class="card">
      <h2>Troops</h2>

      <div class="grid">
        <div>
          <label>Infantry</label>
          <input type="number" id="infantry" placeholder="0"/>
        </div>

        <div>
          <label>Cavalry</label>
          <input type="number" id="cavalry" placeholder="0"/>
        </div>

        <div>
          <label>Archer</label>
          <input type="number" id="archer" placeholder="0"/>
        </div>

        <div>
          <label>Deployment Capacity</label>
          <input type="number" id="capacity" placeholder="0"/>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>Modifiers</h2>

      <label>Troop Ratio</label>
      <select id="ratio">
        <option value="10/10/80">10/10/80</option>
        <option value="5/10/75">5/10/75</option>
        <option value="50/20/30">50/20/30</option>
        <option value="60/40/0">60/40/0</option>
        <option value="70/30/0">70/30/0</option>
        <option value="custom">Custom Ratio</option>
      </select>

      <div id="customRatioBox" class="hidden">
        <label>Custom Ratio</label>
        <input type="text" id="customRatio" placeholder="Example: 10/10/80"/>
      </div>

      <label>City Capacity Bonus</label>
      <select id="cityBonus">
        <option value="0">None</option>
        <option value="0.10">+10% Capacity</option>
        <option value="0.20">+20% Capacity</option>
      </select>

      <label>Fearless Roar</label>
      <select id="fearlessRoar">
        <option value="0">None</option>
        <option value="1500">+1500</option>
        <option value="3000">+3000</option>
        <option value="4500">+4500</option>
        <option value="6000">+6000</option>
        <option value="7500">+7500</option>
        <option value="9000">+9000</option>
      </select>

      <label>Formation Count</label>
      <select id="formations">
        <option>1</option>
        <option>2</option>
        <option>3</option>
        <option selected>4</option>
        <option>5</option>
        <option>6</option>
        <option>7</option>
        <option>8</option>
        <option>9</option>
        <option>10</option>
      </select>
    </div>

    <div class="card">
      <h2>Rules</h2>

      <div class="toggle-row">
        <span>Bear Trap Event</span>
        <label class="switch">
          <input type="checkbox" id="bearTrap" checked>
          <span class="slider"></span>
        </label>
      </div>

      <div class="toggle-row">
        <span>Fill 1st March</span>
        <label class="switch">
          <input type="checkbox" id="fillFirst" checked>
          <span class="slider"></span>
        </label>
      </div>

      <div class="toggle-row">
        <span>Respect Joiner Limit</span>
        <label class="switch">
          <input type="checkbox" id="joinerLimitToggle">
          <span class="slider"></span>
        </label>
      </div>

      <div id="joinerLimitBox" class="hidden">
        <label>Joiner Army Limit</label>
        <input type="number" id="joinerLimit" placeholder="0"/>
      </div>
    </div>

    <div class="card stats-card">
      <h2>Live Stats</h2>

      <div class="stat">
        <span>Running Deployment Capacity</span>
        <strong id="runningCap">0</strong>
      </div>

      <div class="stat">
        <span>Remaining Infantry</span>
        <strong id="remainingInf">0</strong>
      </div>

      <div class="stat">
        <span>Remaining Cavalry</span>
        <strong id="remainingCav">0</strong>
      </div>

      <div class="stat">
        <span>Remaining Archer</span>
        <strong id="remainingArch">0</strong>
      </div>
    </div>

    <div class="card">
      <h2>Marches</h2>

      <div id="results"></div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
